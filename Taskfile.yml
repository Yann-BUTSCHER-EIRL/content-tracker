version: "3"

tasks:
  build:
    desc: Build the development stack
    cmds:
      - docker compose build {{.CLI_ARGS}}

  dev:
    desc: Start the development stack in the background
    cmds:
      - docker compose up -d

  setup:
    desc: Build and start the development stack in the background
    cmds:
      - task build
      - task dev

  logs:
    desc: Follow logs from all Compose services
    cmds:
      - docker compose logs -f

  down:
    desc: Stop the development stack
    cmds:
      - docker compose down

  env-setup:
    desc: Setup the environment variables
    cmds:
      - cp .env.example .env
